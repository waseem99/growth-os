# Non-release feature validation. The mandatory CI security audit remains unchanged.
# Include every V2 contract surface so a conversion/provider-only change
# cannot silently skip the focused schema, ownership and API unit checks.
name: GrowthOS V2 foundation checks

on:
  pull_request:
    paths:
      - "apps/admin/app/(protected)/analytics/variations/**"
      - "apps/admin/app/(protected)/packages/**"
      - "apps/admin/app/(protected)/tracking-rules/**"
      - "apps/admin/app/(protected)/variations/**"
      - "apps/admin/app/preview/variations/**"
      - "apps/web/app/**"
      - "apps/web/lib/campaign-*"
      - "apps/web/lib/checkout-*"
      - "apps/web/lib/conversion-*"
      - "apps/web/lib/provider-*"
      - "apps/web/lib/public-marketing-pixels.ts"
      - "apps/web/lib/tracking-context.ts"
      - "apps/web/lib/dynamic-campaign-resolution.ts"
      - "packages/db/**"
      - "packages/tracking/**"
      - "packages/page-engine/src/variations.ts"
      - "packages/page-engine/src/render.tsx"
      - "tests/e2e/release.spec.ts"
      - "docs/growthos-v2-*.md"
      - "docs/provider-delivery-runbook.md"
      - ".github/workflows/v2-foundation-checks.yml"

permissions:
  contents: read

jobs:
  verify-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: growthos
          POSTGRES_PASSWORD: growthos
          POSTGRES_DB: growthos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U growthos -d growthos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://growthos:growthos@localhost:5432/growthos
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      CONVERSION_INGEST_SECRET: ci-conversion-secret-not-for-production
      NEXT_PUBLIC_ADMIN_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_WEB_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit and contract tests
        run: npm test
      - name: Apply all migrations to disposable CI Postgres
        run: npm run db:migrate
      - name: Verify schema and variation ownership
        run: npm run db:verify:schema
      - name: Seed disposable DB and reconcile
        run: npm run db:seed && npm run db:verify
      - name: Build
        run: npm run build
