name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: growthos
          POSTGRES_PASSWORD: growthos
          POSTGRES_DB: growthos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U growthos -d growthos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://growthos:growthos@localhost:5432/growthos
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      CONVERSION_INGEST_SECRET: ci-conversion-secret-not-for-production
      NEXT_PUBLIC_ADMIN_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_WEB_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run db:verify
      - run: npm run build
      - name: Install Chromium for release E2E
        run: npx playwright install --with-deps chromium
      - name: Production-mode release E2E
        run: npm run test:e2e
        env:
          E2E_USE_PRODUCTION: "1"
