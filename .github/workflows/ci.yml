name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Lint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run lint 2>&1 | tee lint.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] && [ "${{ github.event_name }}" = "pull_request" ]; then
            {
              echo '### Temporary CI lint diagnostic'
              echo '```text'
              head -120 lint.log
              echo '```'
            } > lint-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file lint-comment.md
          fi
          exit "$status"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
